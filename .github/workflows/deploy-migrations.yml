name: Deploy migrations

# GitHub Actions is deliberately reduced to this one job. Every check that
# used to run here (lint, typecheck, unit/property tests, build, a fresh-
# database migration check, integration tests, Playwright/e2e, and the
# case-collisions check) now runs locally before every push and is reported
# in the sprint summary with the exact commands used — see CLAUDE.md's
# "Verification (all local)" section and README's "What runs when". This
# workflow's job is to get supabase/migrations onto the live project and
# the app itself onto Cloudflare, once a change has actually merged to
# main; it trusts that local verification already happened, the same way
# `git push` trusts a developer ran their own build.
#
# Prompt 7g's own A3 close-out: rewritten to actually deploy the app too
# (a Cloudflare Pages/Workers deploy-hook POST, run only once the migration
# push ahead of it has succeeded), not just the database half the previous
# version of this workflow covered — Workers Builds' own auto-build on
# push is turned off (dashboard-side, not a file in this repo) precisely so
# this workflow is the one place that sequences "migrations first, then
# the app," rather than the two racing each other on every push.
on:
  push:
    branches: [main]
  # Lets a human re-run this by hand from the Actions tab (or `gh workflow
  # run deploy-migrations.yml`) without needing an empty commit — for the
  # first run after wiring the four secrets below, or to retry a push that
  # failed for a reason unrelated to the migrations/app themselves (a
  # transient Supabase/Cloudflare outage).
  workflow_dispatch:

# Migrations must apply in the order they land on main, one at a time — a
# second push arriving mid-deploy queues behind the first rather than
# racing it or cancelling it. `cancel-in-progress: false` is the whole
# point: an in-flight `supabase db push` is a live migration against the
# real project, not disposable CI work that's safe to kill.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migrations, then the app
    runs-on: ubuntu-latest
    # Read by every supabase CLI command below, not just one step — link
    # and push both authenticate against the management API with it.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pinned action tag and pinned CLI version — the same version
      # everywhere, not just in this job (see package.json's own
      # `"supabase"` devDependency for the local-desktop half of that).
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.101.0

      # The project ref is a repo secret here, not the literal this
      # workflow used to hardcode — SUPABASE_PROJECT_ID, so the same
      # workflow file could point at a different project without editing
      # it, and so the ref isn't sitting in git history as a side effect
      # of a decision ("it isn't sensitive") this rewrite no longer makes
      # unilaterally. `db push` operates on whichever project is linked;
      # this is that link, not a separate deploy step.
      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # SUPABASE_ACCESS_TOKEN (job env, above) authenticates `link` and the
      # management-API side of `db push`; SUPABASE_DB_PASSWORD is the
      # separate secret `db push` needs to open its own direct Postgres
      # connection and actually apply the migrations — two different
      # credentials for two different connections, both required.
      # Idempotent: a run with nothing new in supabase/migrations is a
      # no-op, not a failure.
      - name: Push new migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # The `capture-run` edge function carries its own bundled copy of
      # the capture importer (`src/capture`), so a merged importer change
      # does not reach the live project until this step ships it: the
      # app's own Cloudflare deploy below never touches it. Found the hard
      # way (2026-10-08): the export/import round-trip fix (#352) was
      # merged and live in the app, but imports kept running the old
      # importer in the unredeployed function. Bundles then deploys, the
      # same two steps as `pnpm functions:deploy:capture-run`; runs after
      # the migrations (a function may call a new RPC) and before the app.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (for the capture-run bundle)
        run: pnpm install --frozen-lockfile
      - name: Deploy the capture-run edge function
        run: pnpm functions:bundle:capture-run && supabase functions deploy capture-run

      # Runs only once migrations have actually succeeded (the step
      # above) — this workflow's whole reason for sequencing the two
      # rather than letting Cloudflare's own push-triggered auto-build
      # race the migration: the app should never start serving a schema
      # change before that schema change is live. `-fsS`: fail the step
      # (and the run) on a non-2xx response rather than silently
      # "succeeding" against a broken or rotated hook URL; `-S` keeps the
      # error body visible even with `-s`'s otherwise-silent progress
      # meter.
      - name: Deploy the app (Cloudflare)
        run: curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK"
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
