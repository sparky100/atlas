name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-test:
    name: Unit and property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: App and Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every primitive under src/ui needs a story (Sprint U1 step 1); this
      # catches a story that no longer typechecks/builds, which
      # `pnpm typecheck`/`pnpm lint` alone don't fully exercise (addon
      # wiring, story-level render errors at build time).
      - run: pnpm build-storybook

  database:
    name: Fresh-database migration check and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Uses the `supabase` devDependency pinned in package.json, not a
      # separately-versioned GitHub Action (`supabase/setup-cli`), so CI and
      # local `pnpm db:start` are always running the same CLI — kept as-is
      # for Sprint C1-H item 1: the CI failure this step used to hit
      # (SQLSTATE 42725 inside `20260906161000_merge_review_queue.sql`,
      # docs/AUDIT-2026-09-C1.md §1.4) was a genuine SQL bug in a migration,
      # not a CLI-versioning problem, so switching the install mechanism
      # would not have fixed it and would give up the single-CLI-version
      # guarantee for no reason. `-x` drops services nothing here exercises
      # (no Storybook/Studio UI is driven against this stack, no
      # image-proxying, no edge functions exist yet in supabase/functions,
      # and neither Vector nor Logflare's log shipping is asserted on by any
      # test) — smaller pull surface, faster startup, same schema and same
      # Postgres/GoTrue/PostgREST/Realtime stack every test actually needs.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,edge-runtime

      # `db reset` replays every file in supabase/migrations against that
      # fresh database in order. Any migration that only worked because an
      # earlier manual fix-up was applied by hand fails right here.
      - name: Apply all migrations to a fresh database
        run: pnpm exec supabase db reset

      # Sprint H1 fix: `supabase status -o env` prints KEY="value" (quoted,
      # shell-source-able) — `cut -d= -f2-` alone leaves the quote
      # characters in the captured string, which then land in $GITHUB_ENV
      # verbatim (GitHub does not strip them), making SUPABASE_URL literally
      # `"http://127.0.0.1:54321"` including the quotes. src/db/env.ts's
      # `z.url()` check then rejects it as an invalid URL. This is why the
      # `database` job has never once passed (docs/AUDIT-2026-09-U2.md's
      # own follow-up finding) — `tr -d '"'` strips them before the value
      # ever reaches $GITHUB_ENV.
      - name: Write integration test environment
        run: |
          echo "SUPABASE_URL=$(pnpm exec supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      # src/db/repository.integration.test.ts (Sprint F1 step 6) runs here,
      # against the database `db reset` just built — real auth (service-role
      # createUser + signInWithPassword), real RLS, no shortcuts.
      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: Playwright smoke (UI Definition of Done)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same rationale as the `database` job's identical step: kept on the
      # pnpm-pinned CLI (Sprint C1-H item 1), `-x` drops services this job
      # doesn't exercise either.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,edge-runtime

      - name: Apply all migrations to a fresh database
        run: pnpm exec supabase db reset

      # The browser bundle only ever sees VITE_-prefixed variables
      # (src/ui/env.ts) — never the service-role key. `tr -d '"'` strips
      # the quoting `supabase status -o env` prints its values with — see
      # the `database` job's identical note; this job carried the same bug.
      - name: Write browser environment
        run: |
          echo "VITE_SUPABASE_URL=$(pnpm exec supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      # e2e/landscape-perf.spec.ts (Sprint U1 step 4b) seeds its 2,000-
      # system/4,000-edge fixture from Node, not through the browser (typing
      # 2,000 elements through a form would test nothing this sprint hasn't
      # already covered) — the same non-VITE_ variables the `database` job
      # writes for the integration tests, needed here too.
      - name: Write server-side environment
        run: |
          echo "SUPABASE_URL=$(pnpm exec supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - run: pnpm build

      # Chromium ships with the `@playwright/test` devDependency's own
      # postinstall on a normal `pnpm install` in CI (unlike this repo's
      # authoring sandbox, which pre-provisions it and skips the download).
      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # e2e/auth-theme.spec.ts (Sprint U1 step 2a) — real sign-up, real
      # theme toggle, a reload with localStorage cleared first so the
      # assertion can only pass via user_preferences round-tripping through
      # Supabase, not a client-side cache alone. e2e/landscape-perf.spec.ts
      # (step 4b) — the required 2,000-system/4,000-edge fps budget, plus
      # the commit_deltas payload-size assertion ADR-015 committed to.
      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The HTML report links traces/videos from here rather than embedding
      # them; playwright.config.ts's `retain-on-failure` writes the raw
      # trace.zip/video files under test-results/ per failed test, which is
      # what `playwright show-trace` actually needs.
      - name: Upload Playwright test-results (traces/videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  deploy-migrations:
    name: Deploy migrations to the linked Supabase project
    # Sprint H1 item 11 (docs/AUDIT-2026-09-U2.md §8.4: "no automated deploy
    # pipeline exists for the live project — migrations were applied
    # interactively"). Runs only on a push to main, after every other job
    # has passed — a migration deploy is exactly the kind of hard-to-reverse
    # action that shouldn't go out on a red build.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, typecheck, unit-test, build, database, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Requires two repo secrets this workflow cannot set itself — a human
      # with access to the Supabase project must add them under this repo's
      # Settings > Secrets and variables > Actions:
      #   SUPABASE_ACCESS_TOKEN — a personal or service access token from
      #     https://supabase.com/dashboard/account/tokens
      #   SUPABASE_PROJECT_ID   — the linked project's ref. Currently
      #     xakqcssapdiatwrmnjop ("Architecture", README's "Environments"
      #     section, docs/AUDIT-2026-09-U2.md §8.1/§8.2).
      # Until both secrets exist, `supabase link` below fails fast with a
      # clear auth error rather than silently doing nothing.
      - name: Link the Supabase project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # Pushes any migration in supabase/migrations not yet recorded on the
      # linked project's own supabase_migrations.schema_migrations history —
      # idempotent, so a run with nothing new to push is a no-op, not a
      # failure.
      - name: Push new migrations
        run: pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
